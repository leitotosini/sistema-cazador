html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:12px 12px 80px;max-width:560px}
.p{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:12px;margin:10px 0;box-shadow:0 0 16px #38bdf81f}

button{cursor:pointer;border-color:var(--c)}button:disabled{opacity:.45;cursor:default}input{width:90px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#070e22;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;padding:14px 2px;color:var(--mu)}nav .on{color:var(--c);text-shadow:0 0 8px var(--c)}
.big{font:700 34px Oxanium,system-ui,sans-serif;color:var(--c);text-shadow:0 0 12px var(--c)}

.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.t{border:1px solid;border-radius:4px;padding:8px;font-size:11px}
.mu{color:var(--mu);font-size:12px}svg{display:block;margin:auto;max-width:100%}.on2{background:#12306b}
